<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GitHub Auth Test</title>
  <!-- Убираем 404 ошибку иконки -->
  <link rel="icon" href="data:,">
  <!-- Подключаем библиотеку Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; width: 280px; text-align: center; }
    input { width: 100%; padding: 8px; margin: 6px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 8px; background: #238636; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="box">
    <div id="auth-form">
      <h2 id="form-title">Вход</h2>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Пароль">
      <button id="submit-btn" onclick="handleAuth()">Войти</button>
      <button onclick="toggleMode()" style="background: transparent; color: #8b949e; font-size: 12px; margin-top: 8px;">
        <span id="toggle-text">Нет аккаунта? Зарегистрироваться</span>
      </button>
    </div>

    <div id="profile" class="hidden">
      <h2>Авторизован!</h2>
      <p id="user-display"></p>
      <button onclick="logout()" style="background: #da3633;">Выйти</button>
    </div>

    <p id="status" style="color: #f8a5c2; font-size: 13px; margin-top: 10px;"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://hptlamaqdsvtdtiyurhw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hOGY47RTMMQ_LNPZEVwpeA_yu88-0av';

    // Инициализация Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let isSignUp = false;

    // Переключение режим Вход / Регистрация
    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('form-title').innerText = isSignUp ? 'Регистрация' : 'Вход';
      document.getElementById('submit-btn').innerText = isSignUp ? 'Зарегистрироваться' : 'Войти';
      document.getElementById('toggle-text').innerText = isSignUp ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    }

    // Вход или регистрация
    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');
      status.innerText = 'Загрузка...';

      let result;
      if (isSignUp) {
        result = await supabaseClient.auth.signUp({ email, password });
      } else {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      }

      if (result.error) {
        status.innerText = result.error.message;
      } else {
        status.innerText = '';
        checkSession();
      }
    }

    // Проверка сохраненной сессии
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (session) {
        document.getElementById('auth-form').classList.add('hidden');
        document.getElementById('profile').classList.remove('hidden');
        document.getElementById('user-display').innerText = session.user.email;
      } else {
        document.getElementById('auth-form').classList.remove('hidden');
        document.getElementById('profile').classList.add('hidden');
      }
    }

    // Выход из аккаунта
    async function logout() {
      await supabaseClient.auth.signOut();
      checkSession();
    }

    // Проверка сессии при открытии страницы
    checkSession();
  </script>
</body>
</html>
